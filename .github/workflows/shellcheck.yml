name: Shell scripts (lint + tests)

# Gates every PR (and every push to main) on:
#   1. `shellcheck` clean on every `*.sh` under `plugins/`
#   2. Existing test suites under `plugins/shipyard/{hooks,scripts}/tests/`
#      executing green.
#
# Rationale (issue #102): the plugin ships shell scripts that run in users'
# sessions with full shell privileges and handle inputs the plugin itself
# treats as untrusted (agent `tool_response` payloads, file paths from JSON,
# lockfile PIDs from disk). A future edit that introduces an `eval`, a bare
# `$var` outside double-quotes inside `[ ... ]`, an unquoted heredoc, or a
# word-splitting hazard would otherwise land silently. This workflow makes
# the failure visible at PR time.
#
# Security note: the workflow only reads the checked-out tree. No secrets,
# no event-payload interpolation into `run:` blocks, no `pull_request_target`.
# See https://github.blog/security/vulnerability-research/how-to-catch-github-actions-workflow-injections-before-attackers-do/

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lint shell scripts under plugins/
        # No separate shellcheck install step: run-shellcheck.sh resolves and
        # verifies a PINNED shellcheck version itself (downloading it from
        # GitHub Releases on first use), rather than whatever `apt-get
        # install shellcheck` happens to ship on this runner image. This is
        # the same pinned binary a local `bash
        # plugins/shipyard/scripts/tests/shellcheck.test.sh` run resolves —
        # see run-shellcheck.sh's header (issue #1296) for why the previous
        # apt-installed version could disagree with a developer's local
        # shellcheck on real findings (SC2015) even when both were "just
        # shellcheck".
        run: |
          set -euo pipefail
          # Pick up production scripts and test scripts. `find` is portable
          # and avoids globstar issues on minimal shells.
          mapfile -d '' scripts < <(find plugins -type f -name '*.sh' -print0)
          if [ "${#scripts[@]}" -eq 0 ]; then
            echo "No shell scripts found — failing fast so a misconfigured glob doesn't pass the gate."
            exit 1
          fi
          printf 'Linting %d script(s):\n' "${#scripts[@]}"
          printf '  %s\n' "${scripts[@]}"
          plugins/shipyard/scripts/run-shellcheck.sh "${scripts[@]}"

  shell-tests:
    name: shell tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run hook test suites
        run: |
          set -euo pipefail
          mkdir -p test-results
          # Run every *.test.sh under plugins/shipyard/{hooks,scripts}/tests/.
          # Each suite is self-contained (its own tmpdir, its own cleanup) and
          # exits non-zero on any failure.
          mapfile -d '' suites < <(find plugins/shipyard -type f -name '*.test.sh' -print0)
          if [ "${#suites[@]}" -eq 0 ]; then
            echo "No test suites found — failing fast so a misconfigured glob doesn't pass the gate."
            exit 1
          fi
          rc=0
          for suite in "${suites[@]}"; do
            printf '\n=== %s ===\n' "$suite"
            # Flatten the suite path into a safe per-suite log filename so
            # every suite's stdout+stderr survives as a structured artifact
            # instead of only the raw job log (issue #865).
            logfile="test-results/${suite//\//__}.log"
            if ! bash "$suite" 2>&1 | tee "$logfile"; then
              rc=1
            fi
          done
          exit "$rc"

      # Upload every suite's captured stdout+stderr as a structured artifact,
      # unconditionally (pass or fail), for the same reason as tests.yml's
      # bash-tests job (issue #865).
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: shell-test-results
          path: test-results/
          if-no-files-found: warn
