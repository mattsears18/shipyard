name: Tests

# Runs the repo's bash unit-test suites on every push and PR so the
# load-bearing safety-hook tests + secret-scrubbing tests can't regress
# silently between PRs.
#
# Rationale (issue #105): before this workflow existed the repo had no
# CI at all. The hook tests under plugins/shipyard/hooks/tests/ and the
# script tests under plugins/shipyard/scripts/tests/ were only run by
# hand on the author's machine, so a PR could land that broke the
# worktree-isolation hook or the secret-scrubbing patterns in the
# auto-reporter and the regression would only surface once a user
# installed the plugin and tripped over it.
#
# This is intentionally a separate workflow from
# external-author-gate.yml (issue #91, issue-intake gate),
# secret-scan.yml (issue #108, gitleaks gate), and the future
# shellcheck workflow (issue #102) — separate concerns, separate
# files, no shared matrix needed. Splitting keeps each gate debuggable
# in isolation and lets failures be addressed without rerunning
# unrelated jobs.
#
# Security note: the third-party action is pinned by full commit SHA
# (not a floating tag) so a tag-repoint supply-chain attack on the
# action repo cannot compromise this workflow. No event-supplied values
# (issue titles, PR bodies, commit messages, branch names) are
# interpolated into `run:` scripts — the workflow only invokes pinned
# actions with static inputs and runs static bash. The one pair of
# event-supplied values it does consume — the PR's base and head commit
# SHAs, for the Conventional Commits scan below — are GitHub-generated
# 40-hex object names, not attacker-authored text, and they are passed
# through `env:` rather than interpolated into the `run:` body so the
# "no event-supplied values in `run:` scripts" invariant holds
# literally. See
# https://github.blog/security/vulnerability-research/how-to-catch-github-actions-workflow-injections-before-attackers-do/

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  # Read-only — we only need to check out the repo and execute its test
  # scripts. No labels, comments, releases, or other writes happen here.
  contents: read

jobs:
  bash-tests:
    name: bash test suites
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history (issue #1534). `actions/checkout` defaults to
          # `fetch-depth: 1`, which leaves the PR's base commit — and every
          # commit the PR adds beyond the tip — unfetched, so any range of
          # the form `<base>..<head>` is unresolvable. The Conventional
          # Commits scan below needs exactly that range. Depth 0 is what
          # makes it a real gate instead of an unresolvable no-op.
          fetch-depth: 0

      # The actual Conventional Commits gate (issues #1412 / #1534).
      #
      # Scans the commits THIS PR adds — `base.sha..head.sha`, the exact set
      # a squash-merge collapses — so a non-conforming subject is caught
      # before it can reach `main`. Runs first because it is ~1s and a
      # violation forces an amend (a new head SHA) that would invalidate a
      # full suite run anyway.
      #
      # Why a step in this job rather than a separate workflow: `bash test
      # suites` is one of the five contexts the `main` ruleset already
      # requires. A new job would publish a new, NON-required context — i.e.
      # an advisory check, not a gate — and per CLAUDE.md extending the
      # required-contexts list is a deliberate, separately-verified ruleset
      # change. Riding an already-required context makes this blocking on
      # day one with no ruleset edit.
      #
      # `pull_request`-only by design. On a `push` to `main` the merge has
      # already happened, so there is nothing left to gate — flagging it
      # then would only red `main` for a subject no longer fixable without
      # a history rewrite the branch ruleset forbids. It also means this
      # step never scans a commit that is already merged: the range is
      # exclusive of `base.sha`, so `main`'s existing history (including
      # the known-non-conforming `c667873`) is out of range by construction
      # and needs no allowlist.
      - name: Conventional Commits subject scan
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          # GitHub-generated 40-hex object names, not attacker-authored
          # text — but passed via `env:` regardless, per the security note
          # at the top of this file.
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          bash plugins/shipyard/scripts/commit-subject-scan.sh \
            "$PR_BASE_SHA" "$PR_HEAD_SHA"

      # Discover every `*.test.sh` under plugins/ and run them. Using
      # `find` (rather than hardcoding paths) means new test files added
      # alongside the convention are picked up automatically — no
      # workflow edit required. Sort for deterministic ordering and use
      # `-print0` / `read -d ''` to be safe against any odd characters
      # in paths.
      - name: Run bash test suites
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p test-results

          tests=()
          while IFS= read -r -d '' f; do
            tests+=("$f")
          done < <(find plugins -type f -name '*.test.sh' -print0 | sort -z)

          if [[ ${#tests[@]} -eq 0 ]]; then
            echo "No test files found under plugins/ matching *.test.sh" >&2
            exit 1
          fi

          echo "Found ${#tests[@]} test file(s):"
          printf '  %s\n' "${tests[@]}"
          echo

          failed=0
          for t in "${tests[@]}"; do
            echo "::group::$t"
            # Flatten the suite path into a safe per-suite log filename
            # (e.g. plugins/shipyard/scripts/tests/foo.test.sh ->
            # test-results/plugins__shipyard__scripts__tests__foo.test.sh.log)
            # so every suite's stdout+stderr survives as a structured
            # artifact instead of only the raw job log (issue #865).
            logfile="test-results/${t//\//__}.log"
            if bash "$t" 2>&1 | tee "$logfile"; then
              echo "::endgroup::"
            else
              rc=$?
              echo "::endgroup::"
              echo "::error file=$t::test suite exited with code $rc"
              failed=$((failed + 1))
            fi
          done

          if (( failed > 0 )); then
            echo "$failed test suite(s) failed." >&2
            exit 1
          fi

          echo "All test suites passed."

      # Upload every suite's captured stdout+stderr as a structured artifact
      # so a failed run's per-suite output survives past the raw job log
      # retention window and can be downloaded/parsed without scrolling the
      # full log (issue #865). `if: always()` runs this even when the suite
      # loop above exits non-zero, so failed runs are captured too — that's
      # the case that matters most for flake/failure analysis.
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bash-test-results
          path: test-results/
          if-no-files-found: warn
